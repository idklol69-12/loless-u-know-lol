<body>

<h2>Loless</h2>
<div id="board"></div>

<script>
const board = document.getElementById("board");

let selected = null;

const pieces = [
  "1dk","Ra","Ka","Ba","Qa","1dk","Ba","Ka","Ra","1dk",
  "Pa","Pa","Pa","Pa","Pa","Pa","Pa","Pa","Pa","Pa",
  "La","La","La","La","La","La","La","La","La","La",
  "","","","","","","","","","",
  "","","","","","","","","","",
  "L","L","L","L","L","L","L","L","L","L",
  "P","P","P","P","P","P","P","P","P","P",
  "IDK","R","K","B","Q","IDK","B","K","R","IDK"
];

function drawBoard() {
  board.innerHTML = "";

  for (let i = 0; i < 80; i++) {
    const cell = document.createElement("div");
    cell.classList.add("cell");

    const row = Math.floor(i / 10);
    const col = i % 10;

    if ((row + col) % 2 === 0) {
      cell.classList.add("white");
    } else {
      cell.classList.add("black");
    }

    cell.textContent = pieces[i];

    cell.addEventListener("click", () => {

      if (selected === null) {
        if (pieces[i] !== "") {
          selected = i;
        }
        return;
      }

      if (i === selected) {
        selected = null;
        return;
      }

      const captured = pieces[i];

      pieces[i] = pieces[selected];
      pieces[selected] = "";

      if (captured === "K") {
        const backupIndex = pieces.indexOf("IDK");
        if (backupIndex !== -1) {
          pieces[backupIndex] = "K";
        } else {
          alert("BLACK WINS!");
          location.reload();
          return;
        }
      }

      if (captured === "Ka") {
        const backupIndex = pieces.indexOf("1dk");
        if (backupIndex !== -1) {
          pieces[backupIndex] = "Ka";
        } else {
          alert("WHITE WINS!");
          location.reload();
          return;
        }
      }

      if (captured === "IDK") {
        alert("BLACK WINS!");
        location.reload();
        return;
      }

      if (captured === "1dk") {
        alert("WHITE WINS!");
        location.reload();
        return;
      }

      selected = null;
      drawBoard();
    });

    board.appendChild(cell);
  }
}

drawBoard();
</script>

</body>
</html>
